name: Fluxo de branches

# Impõe o fluxo: branch de trabalho → develop (ambiente livre, aceita qualquer origem), a MESMA branch de trabalho →
# homolog (nunca a develop) e homolog → main. Cada ambiente tem a sua validação (workflow Validação).
# Roda em todo PR para develop, homolog ou main e falha se a origem não for a permitida.
# O check "Validar fluxo de branches" é obrigatório nas rulesets (scripts/apply-branch-protection.sh).

on:
  pull_request:
    # `edited` existe para reconferir o corpo do PR quando ele é editado (o check de atribuição de IA lê o corpo); só
    # este workflow, que é barato, roda de novo. Nunca `pull_request_target`: o código do PR roda sem segredo.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, homolog, main]

permissions:
  contents: read

jobs:
  validar-origem:
    name: Validar fluxo de branches
    runs-on: ubuntu-latest
    steps:
      - name: Verificar origem e destino
        env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ORIGEM: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          falhar() {
            echo "::error title=Fluxo de branches::$1"
            exit 1
          }

          if [ "$HEAD_REPO" != "$REPO" ]; then
            falhar "PRs vindos de fork não fazem parte do fluxo. Abra o PR a partir de uma branch do repositório."
          fi

          case "$DESTINO" in
            main)
              [ "$ORIGEM" = "homolog" ] || falhar "A main só recebe PR da homolog (origem recebida: '$ORIGEM')."
              ;;
            homolog)
              # A develop nunca é promovida: a homolog recebe a branch de trabalho, já mergeada e validada na develop.
              case "$ORIGEM" in
                develop|main) falhar "A homolog recebe a branch de trabalho, nunca a develop nem a main (origem recebida: '$ORIGEM')." ;;
              esac
              ;;
            develop)
              # A develop é ambiente livre: aceita qualquer branch de trabalho (até ccr-*), menos as branches do fluxo.
              case "$ORIGEM" in
                homolog|main) falhar "A develop não recebe a homolog nem a main (origem recebida: '$ORIGEM')." ;;
              esac
              ;;
            *)
              falhar "Destino '$DESTINO' fora do fluxo."
              ;;
          esac

          echo "Fluxo válido: $ORIGEM → $DESTINO"

      - name: Fazer checkout do código do PR
        uses: actions/checkout@v4
        with:
          # O passo de atribuição de IA lê as mensagens de base..head, e isso pede a história inteira.
          fetch-depth: 0

      - name: Garantir que a memória de trabalho não entre na homolog nem na main
        env:
          DESTINO: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # docs/HANDOFF.md é a memória de um trabalho em etapas e existe só na branch de trabalho (CLAUDE.md,
          # "Trabalho com o Claude em etapas").
          # Na develop (ambiente livre) ele é permitido; não pode chegar a homolog nem a main, e por isso o PR para
          # esses destinos é reprovado enquanto o arquivo estiver na árvore.
          if [ "$DESTINO" != develop ] && [ -e docs/HANDOFF.md ]; then
            echo "::error title=Memória de trabalho::O arquivo docs/HANDOFF.md é só da branch de trabalho e não pode entrar em homolog nem main. Remova-o (git rm) no commit final do trabalho, antes de abrir o PR."
            exit 1
          fi

          echo "Memória de trabalho conferida para o destino $DESTINO."

      - name: Barrar atribuição de IA em commits e no corpo do PR
        # Defesa em profundidade do hook local .claude/hooks/gate-atribuicao.sh (#254): pega o que ele não vê (texto
        # montado na execução, --amend, cherry-pick). Só os commits de base..head são avaliados: o que já está na base
        # não é reavaliado, porque a main tem trailers antigos. A identidade git (autor e committer) não é avaliada
        # (limite do ambiente). A linha do rodapé automático da plataforma, com ou sem o caminho da sessão, é ignorada
        # só no corpo do PR, porque o próprio PR a recebe; em mensagem de commit ela reprova. O texto de fora (corpo do
        # PR, shas) entra só por variável de ambiente, nunca dentro do `run:`.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/atribuicao-gate.mjs "$BASE_SHA" "$HEAD_SHA"
