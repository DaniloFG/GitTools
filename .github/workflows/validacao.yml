name: Validação

# O mesmo pipeline em cada ambiente: typecheck, testes, builds, tamanho do pacote e ponta a ponta na interface de
# verdade (scripts/validacao/pipeline.mjs). A homolog recebe só a branch de trabalho (nunca a develop) e por isso
# não é comparada com a develop: cada ambiente é validado por inteiro.
on:
  push:
    branches: [develop, homolog]
  workflow_dispatch:

permissions:
  contents: read

# Uma validação por ref; a seguinte espera a atual terminar para cada commit ter o seu relatório.
concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validacao:
    name: Validação (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # Playwright só para o ponta a ponta: fica fora do package.json (o projeto não tem dependência de execução nova).
      - name: Instalar Playwright e Chromium
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      # O harness (scripts/readme-media/harness.mjs) lê estas duas variáveis.
      - name: Apontar o harness para o Playwright e o Chromium
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Validar
        run: node scripts/validacao/pipeline.mjs
      - name: Guardar o relatório e os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-${{ github.ref_name }}
          path: validacao-out/
          retention-days: 14
