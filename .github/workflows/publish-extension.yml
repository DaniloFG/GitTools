name: Publicar extensão do VS Code

# Publica a extensão no VS Code Marketplace (e, se houver o token, no Open VSX) depois de compilar,
# testar e empacotar. Quando roda:
#  - a cada merge na main que mexa no que vai para a extensão. A versão é a de extension/package.json se ela
#    for maior que a última tag v*; senão, a última tag com o último número + 1 (ver scripts/extension-version.mjs).
#    Para uma minor ou major, suba extension/package.json à mão. Se a versão já estiver publicada, o workflow
#    termina sem erro;
#  - ao criar uma tag "v0.5.1" (a versão publicada é a da tag);
#  - manualmente, em Actions → Run workflow.
on:
  push:
    branches: [main]
    # Só o que entra no .vsix: a interface, o backend e o código da extensão (não o app Electron, os
    # testes nem a documentação). Tags ignoram este filtro.
    paths:
      - 'extension/**'
      - 'src/**'
      - '!src/main/**'
      - '!src/preload/**'
      - 'scripts/**'
      - 'vite.webview.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 0.5.1). Em branco, a automática: a do extension/package.json se for maior que a última tag v*, senão a última tag + 1 no último número.'
        required: false

permissions:
  contents: write # anexar o .vsix ao release

# Uma publicação de cada vez (dois merges seguidos não disputam a mesma versão).
concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # as tags vêm junto: a versão automática sai delas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run typecheck
      - run: npm test

      # As entradas do evento (versão digitada, tipo da ref) entram só por env: dentro de run: elas seriam
      # interpoladas no script e permitiriam injeção de comando.
      - name: Definir a versão da extensão
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then VERSION=$(node scripts/extension-version.mjs); fi
          if [ -n "$VERSION" ]; then
            # Validada no Node: a regex do JS não aceita quebra de linha no meio (o grep valida linha a linha).
            if ! node -e "process.exit(/^\d+\.\d+\.\d+$/.test(process.argv[1]) ? 0 : 1)" "$VERSION"; then
              echo "::error::Versão inválida (esperado x.y.z, ex.: 0.5.1)."
              exit 1
            fi
            node -e "const fs=require('fs');const p='extension/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$VERSION"
          fi
          echo "version=$(node -p "require('./extension/package.json').version")" >> "$GITHUB_OUTPUT"

      # Portão do changelog de usuário. O corpo do release sai da seção do CHANGELOG (nunca de títulos de PR ou de
      # commit) e é conferido ANTES de empacotar e de publicar. Falha aqui fecha tudo: os passos seguintes (Marketplace,
      # Open VSX e release) não rodam. Por isso nada neste trecho usa continue-on-error.
      - name: Notas do release (do CHANGELOG)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-gate.mjs notes extension/CHANGELOG.md "$VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Gate do changelog de usuário
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-gate.mjs check extension/CHANGELOG.md "$VERSION" "$RUNNER_TEMP/release-notes.md"

      - run: npm run package:extension
        env:
          NODE_ENV: production

      - name: Publicar no VS Code Marketplace
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::Secret VSCE_PAT não configurado: a extensão NÃO foi publicada no Marketplace (o .vsix está nos artifacts)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          OUT=$(cd extension && npx vsce publish --no-dependencies --packagePath ../release/gittools-vscode-"$VERSION".vsix 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "::notice::A versão $VERSION já está publicada: nada a fazer. A versão automática já pula as publicadas; confira as tags v* (o checkout precisa de fetch-depth: 0)."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi

      - name: Publicar no Open VSX (VSCodium, Cursor…)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Secret OVSX_PAT não configurado: Open VSX ignorado."
            exit 0
          fi
          set +e
          OUT=$(npx ovsx publish release/gittools-vscode-"$VERSION".vsix -p "$OVSX_PAT" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ] && echo "$OUT" | grep -qi "already published\|already exists"; then
            echo "::notice::A versão já está no Open VSX: nada a fazer."
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi

      # Numa tag, anexa ao release dela; numa publicação nova vinda da main, cria o release v<versão>.
      - name: Anexar o .vsix ao release
        if: github.ref_type == 'tag' || steps.marketplace.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: release/*.vsix
          # O corpo é a seção do CHANGELOG já conferida pelo portão; nunca gerado de títulos de PR ou de commit.
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: gittools-vscode
          path: release/*.vsix
