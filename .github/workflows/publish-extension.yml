name: Publicar extensão do VS Code

# Publica a extensão no VS Code Marketplace (e, se houver o token, no Open VSX) depois de compilar,
# testar e empacotar. Quando roda:
#  - a cada merge na main que mexa no que vai para a extensão (a versão é a de extension/package.json;
#    se ela já estiver publicada, não há nada a fazer e o workflow termina sem erro);
#  - ao criar uma tag "v0.5.1" (a versão publicada é a da tag);
#  - manualmente, em Actions → Run workflow.
on:
  push:
    branches: [main]
    # Só o que entra no .vsix: a interface, o backend e o código da extensão (não o app Electron, os
    # testes nem a documentação). Tags ignoram este filtro.
    paths:
      - 'extension/**'
      - 'src/**'
      - '!src/main/**'
      - '!src/preload/**'
      - 'scripts/**'
      - 'vite.webview.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 0.5.1). Em branco usa a do extension/package.json.'
        required: false

permissions:
  contents: write # anexar o .vsix ao release

# Uma publicação de cada vez (dois merges seguidos não disputam a mesma versão).
concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run typecheck
      - run: npm test

      - name: Definir a versão da extensão
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$VERSION" ]; then
            node -e "const fs=require('fs');const p='extension/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$VERSION"
          fi
          echo "version=$(node -p "require('./extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run package:extension
        env:
          NODE_ENV: production

      - name: Publicar no VS Code Marketplace
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::Secret VSCE_PAT não configurado: a extensão NÃO foi publicada no Marketplace (o .vsix está nos artifacts)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          OUT=$(cd extension && npx vsce publish --no-dependencies --packagePath ../release/gittools-vscode-${{ steps.version.outputs.version }}.vsix 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "::notice::A versão ${{ steps.version.outputs.version }} já está publicada: nada a fazer. Para publicar de novo, suba a versão em extension/package.json."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi

      - name: Publicar no Open VSX (VSCodium, Cursor…)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Secret OVSX_PAT não configurado: Open VSX ignorado."
            exit 0
          fi
          set +e
          OUT=$(npx ovsx publish release/gittools-vscode-${{ steps.version.outputs.version }}.vsix -p "$OVSX_PAT" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ] && echo "$OUT" | grep -qi "already published\|already exists"; then
            echo "::notice::A versão já está no Open VSX: nada a fazer."
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi

      # Numa tag, anexa ao release dela; numa publicação nova vinda da main, cria o release v<versão>.
      - name: Anexar o .vsix ao release
        if: github.ref_type == 'tag' || steps.marketplace.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: release/*.vsix
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: gittools-vscode
          path: release/*.vsix
