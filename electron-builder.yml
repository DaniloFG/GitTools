appId: com.danilofg.gittools
productName: GitTools
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target: nsis
  artifactName: GitTools-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Danilo Gama
